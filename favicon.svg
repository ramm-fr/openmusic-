<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">

  <!-- TOP slice -->
  <g fill="white">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,0; 0,0; -3,0; 0,0; 2,0; 0,0; 0,0"
      keyTimes="0; 0.3; 0.5; 0.52; 0.54; 0.56; 0.58; 1"
      dur="2s" repeatCount="indefinite"/>
    <rect x="8" y="1" width="2" height="4"/>
    <rect x="10" y="1" width="3" height="2"/>
    <rect x="10" y="3" width="2" height="2"/>
  </g>

  <!-- MID slice -->
  <g fill="white">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,0; 0,0; 2,0; 0,0; -3,0; 0,0; 0,0"
      keyTimes="0; 0.3; 0.5; 0.52; 0.54; 0.56; 0.58; 1"
      dur="2s" repeatCount="indefinite"/>
    <rect x="8" y="5" width="2" height="4"/>
  </g>

  <!-- BOTTOM slice -->
  <g fill="white">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,0; 0,0; -2,0; 0,0; 3,0; 0,0; 0,0"
      keyTimes="0; 0.3; 0.5; 0.52; 0.54; 0.56; 0.58; 1"
      dur="2s" repeatCount="indefinite"/>
    <rect x="4" y="9"  width="6" height="2"/>
    <rect x="3" y="8"  width="7" height="1"/>
    <rect x="3" y="11" width="7" height="1"/>
    <rect x="4" y="12" width="5" height="1"/>
  </g>

</svg>
