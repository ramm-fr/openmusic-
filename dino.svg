<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">

  <!-- Pixel Lion -->
  <g fill="white">
    <!-- Mane -->
    <rect x="2" y="1" width="1" height="1"/>
    <rect x="3" y="1" width="1" height="1"/>
    <rect x="4" y="1" width="1" height="1"/>
    <rect x="5" y="1" width="1" height="1"/>
    <rect x="6" y="1" width="1" height="1"/>
    <rect x="7" y="1" width="1" height="1"/>
    <rect x="8" y="1" width="1" height="1"/>
    <rect x="9" y="1" width="1" height="1"/>
    <rect x="10" y="1" width="1" height="1"/>
    <rect x="11" y="1" width="1" height="1"/>
    <rect x="12" y="1" width="1" height="1"/>
    <rect x="13" y="2" width="1" height="1"/>
    <rect x="13" y="3" width="1" height="1"/>
    <rect x="13" y="4" width="1" height="1"/>
    <rect x="12" y="5" width="1" height="1"/>
    <rect x="1" y="2" width="1" height="1"/>
    <rect x="1" y="3" width="1" height="1"/>
    <rect x="1" y="4" width="1" height="1"/>
    <rect x="2" y="5" width="1" height="1"/>
    
    <!-- Head -->
    <rect x="4" y="3" width="8" height="3"/>
    <rect x="3" y="4" width="1" height="1"/>
    <rect x="12" y="4" width="1" height="1"/>
    
    <!-- Face -->
    <rect x="5" y="4" width="6" height="2"/>
    
    <!-- Eyes -->
    <rect x="6" y="4" width="1" height="1"/>
    <rect x="9" y="4" width="1" height="1"/>
    
    <!-- Nose -->
    <rect x="7" y="5" width="2" height="1"/>
    
    <!-- Body -->
    <rect x="5" y="6" width="6" height="3"/>
    <rect x="4" y="7" width="1" height="1"/>
    <rect x="11" y="7" width="1" height="1"/>
    
    <!-- Legs -->
    <rect x="5" y="9" width="2" height="2"/>
    <rect x="9" y="9" width="2" height="2"/>
    
    <!-- Tail -->
    <rect x="1" y="7" width="3" height="1"/>
    <rect x="0" y="8" width="1" height="1"/>
  </g>

</svg>
